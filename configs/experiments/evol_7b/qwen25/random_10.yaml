# Qwen2.5-7B + WizardLM Evol-Instruct 70K, random 10% selection.
# Drop-in evol-data counterpart of main_7b/qwen25/random_10.yaml — only the
# training data is swapped (WizardLM Evol-Instruct 70K instead of Alpaca-GPT4).
# Eval benchmarks and selector hyperparameters are unchanged.
defaults:
  - configs/base.yaml
  - configs/methods/random.yaml
  - configs/models/qwen2.5-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: evol_7b/qwen25/random_10
selection_ratio: 0.1
train_epochs: 3

# Override Alpaca-GPT4 default (configs/base.yaml:27-28).
# build_alpaca_dataset just reads the JSON; the WizardLM Evol-Instruct dump
# uses {instruction, output} which the alpaca loader handles (input falls
# back to "" via .get).
data_files: /group-volume/IT-datasets/wizardlm_evol_instruct_70k/alpaca_evol_instruct_70k.json
dataset_name: WizardLMTeam/WizardLM_evol_instruct_70k
